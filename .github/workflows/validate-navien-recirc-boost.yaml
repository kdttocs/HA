name: Validate Navien Recirc Boost

on:
  push:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "tests/**"
      - ".github/workflows/validate-navien-recirc-boost.yaml"
  pull_request:
    paths:
      - "custom_components/**"
      - "hacs.json"
      - "tests/**"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # license: the repo has no LICENSE file yet (Scott to decide). Not needed to install as a custom repository.
          ignore: brands description topics license

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component paho-mqtt
      - run: PYTHONPATH=. pytest tests -q -o asyncio_mode=auto -p no:cacheprovider
